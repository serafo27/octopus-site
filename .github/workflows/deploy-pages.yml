name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-create/enable the Pages site (with GitHub Actions as the source)
          # so the first deploy doesn't fail with "Get Pages site failed / Not Found".
          enablement: true

      # Browsers keep styles.css and the scripts for a while: a new deploy gives them new URLs.
      - name: Version the stylesheet and scripts
        run: |
          version=${GITHUB_SHA::7}
          find docs -name '*.html' -exec sed -i -E "s/(<(link|script)[^>]*(href|src)=\"[^\":]*\.(css|js))\"/\1?v=${version}\"/g" {} +
          grep -rhoE '(styles|app|site-config)\.(css|js)\?v=[0-9a-f]+' docs | sort | uniq -c

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
