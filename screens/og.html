<!doctype html>
<!-- The site's social preview (docs/assets/og.png, 1200×630), the image search results and shared links show.
     sh screens/og.sh renders it with headless Chrome. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: radial-gradient(70% 60% at 70% 100%, rgba(160, 131, 255, 0.28), transparent 70%), #100f17;
      color: #ecebf3; font-family: Inter, system-ui, sans-serif; position: relative;
    }
    .copy { position: absolute; left: 72px; top: 76px; width: 470px; display: grid; gap: 22px; }
    .brand { display: flex; align-items: center; gap: 16px; font: 700 34px "Familjen Grotesk", sans-serif; }
    .brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 14px 40px -10px rgba(160, 131, 255, 0.55); }
    h1 { margin: 0; font: 700 52px/1.06 "Familjen Grotesk", sans-serif; letter-spacing: -0.03em; }
    p { margin: 0; font-size: 23px; line-height: 1.45; color: #9e9ab0; }
    .shot {
      position: absolute; left: 590px; top: 70px; width: 900px; border-radius: 14px; overflow: hidden;
      border: 1px solid #2f2c3d; box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9), 0 18px 50px -20px rgba(110, 80, 220, 0.5);
    }
    .shot img { display: block; width: 100%; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../docs/assets/icon.png" alt="" /> Octopus</div>
    <h1>Every project in order.</h1>
    <p>Tasks, terminals, AI sessions, docs and git for every project, in one Mac app.</p>
  </div>
  <div class="shot"><img src="../docs/assets/screens/board.webp" alt="" /></div>
</body>
</html>
